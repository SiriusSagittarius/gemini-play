org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# flutter_inappwebview_android 1.1.3 nutzt noch proguard-android.txt, das AGP 9 sonst ablehnt.
# Entfernen, sobald eine neuere stabile Version des Plugins erscheint.
android.r8.proguardAndroidTxt.disallowed=false
# Pub-Cache (D:, USB-Stick) und Projekt (C:) liegen auf verschiedenen Laufwerken;
# der inkrementelle Kotlin-Compiler kann damit nicht umgehen.
kotlin.incremental=false
