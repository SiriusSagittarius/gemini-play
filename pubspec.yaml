name: promptplay
description: "PromptPlay – AI Mini-App & Game Creator"
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  http: ^1.2.2
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  in_app_purchase: ^3.3.1
  crypto: ^3.0.7
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Three.js r186 (MIT) samt GLTF-/Draco-/HDR-Ladern, Bloom und dem Helfer
    # PromptPlay als ein Skript mit globalem THREE, gebaut mit esbuild aus dem
    # npm-Paket „three“ (siehe GameLibraries in lib/main.dart).
    - assets/three/three.min.js
